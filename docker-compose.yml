services:
  postgres:
    image: postgres:16-alpine
    container_name: fss-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: foreign_service_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d foreign_service_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: fss-valkey
    ports:
      - "6379:6379"

  # アプリ一括起動: docker compose --profile app up --build → http://localhost:3000
  # migrate + seed は prisma CLI / tsx が必要なため builder ステージで一度だけ実行する
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://app:localpassword@postgres:5432/foreign_service_dev?schema=public
    command: >-
      sh -c "pnpm --filter api exec prisma migrate deploy &&
             pnpm --filter api db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://app:localpassword@postgres:5432/foreign_service_dev?schema=public
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # SSR はコンテナ間通信で API を呼ぶ（ビルド時に埋め込まれる）
        NEXT_PUBLIC_API_URL: http://api:4000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
