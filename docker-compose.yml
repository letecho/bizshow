services:
  postgres:
    image: postgres:16-alpine
    container_name: fss-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: foreign_service_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d foreign_service_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: fss-valkey
    ports:
      - "6379:6379"

volumes:
  pgdata:
