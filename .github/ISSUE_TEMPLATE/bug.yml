name: 不具合
description: バグ報告
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 事象
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
