name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # lockfile-sync から再実行される

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ブランチ保護の Required status check にはこのジョブ名 "verify" を指定する
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # バージョンは package.json の packageManager を使用
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml がありません。Lockfile Sync ワークフローの自動コミットを待ってください。"
            exit 1
          fi
          pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter api exec prisma generate
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Lint / Typecheck / Test / Build
        run: pnpm turbo run lint typecheck test build --cache-dir=.turbo

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact -v

  # 主要導線（トップ → カテゴリ絞込 → 詳細）の E2E スモーク
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: foreign_service_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d foreign_service_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:localpassword@localhost:5432/foreign_service_dev?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate / migrate / seed
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api db:seed
      - name: Build web / api
        run: pnpm turbo run build --filter=web --filter=api
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm --filter web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
